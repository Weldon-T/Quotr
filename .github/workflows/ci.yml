name: Quotr CI

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      layer:
        description: 'Test layer'
        required: true
        type: choice
        options: [smoke, critical, regression]

env:
  QUOTR_EMAIL: ${{ secrets.QUOTR_EMAIL }}
  QUOTR_PASSWORD: ${{ secrets.QUOTR_PASSWORD }}

jobs:

  # ==================== L0 Smoke — every PR & push ====================
  smoke:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10', cache: 'pip' }
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
          .venv/bin/playwright install chromium --with-deps
      - name: L0 Smoke
        run: .venv/bin/python run_ci.py --layer smoke
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: tests/reports/

  # ==================== L1 Critical Path — daily ====================
  critical:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10', cache: 'pip' }
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
          .venv/bin/playwright install chromium --with-deps
      - name: L1 Critical Path
        run: .venv/bin/python run_ci.py --layer critical
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: critical-report
          path: tests/reports/
      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v1
        with:
          payload: '{"text": "L1 Critical Path FAILED — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

  # ==================== L2 Full Regression — manual ====================
  regression:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10', cache: 'pip' }
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
          .venv/bin/playwright install chromium --with-deps
      - name: L2 Full Regression
        run: .venv/bin/python run_ci.py --layer regression
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-report
          path: tests/reports/
      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v1
        with:
          payload: '{"text": "L2 Full Regression FAILED — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

  # ==================== Dependency audit — every PR ====================
  audit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - name: Install and audit
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip audit
