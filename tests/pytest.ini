[pytest]
# 测试目录
testpaths = tests

# 超时（毫秒）
timeout = 300000

# Markers
markers =
    smoke: L0 Smoke — 每次 PR 运行
    critical: L1 Critical Path — 每日运行
    regression: L2 Full Regression — RC 时运行
    security: 安全测试
    payment: Stripe 支付测试
    performance: 性能测试（延迟、渲染、负载）
    a11y: 无障碍测试
    concurrency: 并发测试
    migration: 数据迁移测试
    ai: AI 模型评估（Golden Baseline / BERTScore / RAGAs）
    slow: 耗时超过 60s 的测试
    flaky: 已知不稳定的测试（需 Triage）
    p0: P0 优先级
    p1: P1 优先级
    p2: P2 优先级

# 输出
addopts = -v --tb=short --strict-markers -p no:warnings
